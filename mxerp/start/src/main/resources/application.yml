# ============================================================================
# MXERP 应用配置
# 运行环境相关参数一律用 ${ENV:默认值} 占位，禁止把生产口令写进仓库。
# ============================================================================

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: mxerp

  # --------------------------------------------------------------------------
  # 数据源：SQL Server（内核使用 @Nationalized + [%TABLE%] 括号标识符，故为 MSSQL）
  # 驱动 com.microsoft.sqlserver:mssql-jdbc 版本由 Spring Boot BOM 托管
  # --------------------------------------------------------------------------
  datasource:
    url: "jdbc:sqlserver://${MXERP_DB_HOST:localhost}:${MXERP_DB_PORT:1433};databaseName=${MXERP_DB_NAME:mxerp};encrypt=${MXERP_DB_ENCRYPT:false};trustServerCertificate=true"
    username: ${MXERP_DB_USERNAME:sa}
    password: ${MXERP_DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: mxerp-pool
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # --------------------------------------------------------------------------
  # JPA / Hibernate
  # 方言不显式指定，交由 Hibernate 依据 JDBC 元数据自动探测（SQLServerDialect）
  # --------------------------------------------------------------------------
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # 生产环境请改为 none 或 validate，表结构交由迁移脚本管理
      ddl-auto: ${MXERP_JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
          batch_size: 50
        order_inserts: true
        order_updates: true

  # --------------------------------------------------------------------------
  # Jackson：统一日期格式与时区，null 字段不下发
  # --------------------------------------------------------------------------
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  threads:
    virtual:
      enabled: true

# ============================================================================
# Axon Framework（CQRS）
# 已排除 axon-server-connector，默认走内嵌事件存储。
# 注意：Application 类中排除了 Axon 的 JpaEventStoreAutoConfiguration 等自动配置，
#       若需要 JPA 持久化事件存储，需放开排除项或在此显式声明存储实现。
# ============================================================================
# axon:
#   axonserver:
#     enabled: false
#   serializer:
#     general: jackson
#     events: jackson
#     messages: jackson

# ============================================================================
# 日志
# ============================================================================
logging:
  level:
    root: info
    com.mxerp: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
